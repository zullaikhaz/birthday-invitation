<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Special Invitation ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600&family=Playwrite+AU+QLD:wght@100..400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="hero-page">

    <div class="floating-hearts">
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
        <span>♥</span>
    </div>

    <main class="hero">

        <div class="hero-content">

            <p class="small-text">
                A little something for someone special ♡
            </p>

            <h1>
                You've Received<br>
                A Special Invitation
            </h1>

            <div class="envelope-wrapper" id="openInvitation">

                <div class="envelope">

                    <div class="letter">
                        <span class="heart">♥</span>

                        <p>
                            For my birthday boy ❤️
                        </p>
                    </div>

                    <div class="envelope-front"></div>
                    <div class="envelope-flap"></div>

                    <div class="envelope-heart">
                        ♥
                    </div>

                </div>

            </div>

            <p class="click-text">
                Tap the envelope to open ♡
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
